name: clean_auth_kit
description: "A Clean Architecture Flutter authentication feature — email/password and Google Sign-In on Firebase."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0

  # Google Sign-In (v7.2.0 - new reactive model with GoogleSignIn.instance)
  google_sign_in: 7.2.0

  # Web-only renderButton() for Google Sign-In, imported directly by
  # GoogleAuthButton (behind a conditional export) — an explicit
  # dependency here since we reference it directly, not just through
  # google_sign_in's own transitive resolution.
  google_sign_in_web: ^1.1.3

  # SVG rendering (used for the official Google logo on the button)
  flutter_svg: ^2.0.10+1

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Functional programming
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.7

  # Immutable code / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Firebase Firestore
  cloud_firestore: ^6.1.0

  # Rive animations
  rive: ^0.14.10

  # Localization (English/Spanish)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  riverpod_generator: ">=4.0.1 <5.0.0"

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/rive/
