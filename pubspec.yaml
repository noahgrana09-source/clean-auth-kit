name: product_searcher
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0

  # Google Sign-In (v7.2.0 - nuevo modelo reactivo con GoogleSignIn.instance)
  google_sign_in: 7.2.0

  # SVG rendering (usado para el logo oficial de Google en el botón)
  flutter_svg: ^2.0.10+1

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Functional programming
  dartz: ^0.10.1

  # Value equality
  equatable: ^2.0.7

  # Código inmutable / serialización
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Firebase Firestore
  cloud_firestore: ^6.1.0

  # Rive animations
  rive: ^0.14.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  riverpod_generator: ">=4.0.1 <5.0.0"

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/rive/
